<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ poll.title }}</title>
</head>
<body>
    <h1>{{ poll.title }}</h1>
    <p>{{ poll.question }}</p>

    {% if status %}
        <p>Status: {{ status }}</p>
        <ul>
            {% for choice in poll.choices %}
                <li>{{ choice.choice_text }} ({{choice.votes}} votes)</li>
            {% endfor %}
        </ul>
    {% else %}
        <form id="voteForm" method="post" action="{% url 'polls:vote-poll' poll.id %}">
            {% csrf_token %}
            <ul>
                {% for choice in poll.choices %}
                    <li  id="choice_{{ choice.id }}">
                        <label>
                            <input type="radio" name="choice" value="{{ choice.id }}" required>
                            {{ choice.choice_text }} ({{ choice.votes }} votes)
                        </label>
                    </li>
                {% endfor %}
            </ul>
            <button type="submit">Vote</button>
        </form>
    {% endif %}

    <script>
        const pollId = "{{ poll.id }}";
        const pollStatus = "{{ status }}".trim();

        if (pollStatus === "Closed") {
            console.log("Poll is closed.");
        } else {
            const socket = new WebSocket(`ws://${window.location.host}/ws/vote/${pollId}/`);

            socket.onmessage = function(e) {
                try {
                    const data = JSON.parse(e.data);

                    if ('error' in data) {
                        alert(data.error);
                    } else {
                        const choiceElement = document.querySelector(`#choice_${data.choice_id}`);
                        if (choiceElement) {
                            const voteLabel = choiceElement.querySelector('label');
                            if (data.choice_text && data.votes !== undefined) {
                                voteLabel.innerHTML = `<input type="radio" name="choice" value="${data.choice_id}" required> ${data.choice_text} (${data.votes} votes)`;
                            }
                        }
                    }
                } catch (err) {
                    console.error("Failed to parse message data:", err);
                }
            };

            document.getElementById('voteForm').onsubmit = function(event) {
                event.preventDefault();

                const selectedChoice = document.querySelector('input[name="choice"]:checked');
                if (selectedChoice) {
                    socket.send(JSON.stringify({
                        'choice_id': selectedChoice.value
                    }));
                } else {
                    alert('Please select a choice before voting.');
                }
            };
        }
    </script>
</body>
</html>
